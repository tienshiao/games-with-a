<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Beginning of Crazy Animals</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0f1e;
      /* Stop pinch-zoom / scroll-bounce on mobile so taps only flap. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The game's parent box. Its height is set from JS on every viewport
       change — see fitToViewport() in main.ts — because iOS reports a layout
       viewport taller than the visible area. */
    #game {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    /* Centering is handled by Phaser's Scale Manager (autoCenter: CENTER_BOTH).
       Don't also center here, or the canvas gets double-offset. */
    canvas {
      display: block;
    }
    /* Two canvases stacked in #game: Three.js draws the world underneath,
       Phaser draws the HUD on top and takes all the input. */
    #game canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
    #game canvas.world3d {
      pointer-events: none;
    }
    /* Measures env(safe-area-inset-bottom) so JS can keep the bottom HUD clear
       of the home indicator. Never visible. */
    #safe-area-probe {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 0;
      height: env(safe-area-inset-bottom, 0px);
      pointer-events: none;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="safe-area-probe"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
