<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Popcorn Panic</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #2a1d14;
      /* No pinch-zoom, scroll-bounce, text selection or long-press callouts:
         every touch belongs to the game. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    }
    /* Sized from JS on every viewport change (see fitToViewport in main.ts),
       because iOS reports a layout viewport taller than the visible area. */
    #game {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #game canvas {
      position: absolute;
      inset: 0;
      display: block;
      touch-action: none;
    }
    /* HUD sits over the canvas. It lets pointers through to the canvas except
       on its buttons, which catch their own. */
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #hud .button {
      pointer-events: auto;
      touch-action: none;
    }
    #safe-area-probe {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 0;
      height: env(safe-area-inset-bottom, 0px);
      pointer-events: none;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="hud"></div>
  </div>
  <div id="safe-area-probe"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
